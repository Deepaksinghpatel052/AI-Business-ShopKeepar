services:
  app:
    build: .
    image: ai-shopkeeper:latest
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/bizinsight.db
    volumes:
      - app_data:/app/data
      - app_faiss_store:/app/faiss_store
      - app_media:/app/media
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  app_data:
  app_faiss_store:
  app_media:
  app_logs:
