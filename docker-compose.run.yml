services:
  app:
    image: ai-shopkeeper:latest
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/bizinsight.db
    volumes:
      - ./data:/app/data
      - ./faiss_store:/app/faiss_store
      - ./media:/app/media
      - ./logs:/app/logs
    restart: unless-stopped
