services:
  app:
    image: ai-shopkeeper:latest
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/bizinsight.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      - app_faiss_store:/app/faiss_store
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  app_data:
  app_faiss_store:
  app_logs:
